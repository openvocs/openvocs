<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">

	<title>openvocs voice</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1.0, user-scalable=0">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<!-- Place favicon.ico in the root directory -->
	<link rel="icon" type="image/x-icon" href="/favicon.ico" />
	<link rel="stylesheet" href="/plugin/simple-keyboard-3.8.0/css/index.css">
	<link rel="stylesheet" type="text/css" href="/css/ov_basic.css" />
	<link rel="manifest" href="./manifest.json">
</head>

<body>
	<div class="container" id="view_container"></div>

	<script type="text/javascript" src="/VERSION.js"></script>
	<script type="text/javascript" src="./views/auth/js/default_config.js"></script> <!-- default login config -->
	<script type="text/javascript" src="./views/loops/js/default_config.js"></script> <!-- default vocs config -->
	<script type="text/javascript" src="/config_vocs.js"></script> <!-- user config -->

	<script>
		var script = document.createElement('script');
		script.type = 'text/javascript';
		script.async = true;
		script.src = "/plugin/simple-keyboard-3.8.0/index.modern.js";
		var first_script = document.getElementsByTagName('script')[0];
		first_script.parentNode.insertBefore(script, first_script);
	</script>


	<script>
		if ('serviceWorker' in navigator) {
			// Register the Service Worker
			navigator.serviceWorker.register('./service-worker.js')
				.then(function (registration) {
					console.log('Service Worker registered with scope:', registration.scope);
				})
				.catch(function (error) {
					console.log('Service Worker registration failed:', error);
				});
		}
	</script>

	<script type="module">
		import ov_Websocket from "/lib/ov_websocket.js";
		import * as ov_Websockets from "/lib/ov_websocket_list.js";
		import * as Auth_View from "./views/auth/js/auth.js";
		import * as Voice_Client from "./views/loops/js/vocs.js";
		import * as ov_Auth from "/lib/ov_auth.js";

		document.addEventListener("DOMContentLoaded", async function () {
			let view_container = document.getElementById("view_container");
			view_container.addEventListener("switch_view", () => {
				Auth_View.remove();
				console.log("switch view: from auth to vocs");
				Voice_Client.render(view_container);
			});

			await ov_Websockets.setup_connections(ov_Websocket);

			//initial disconnect handler gets overwritten
			ov_Websockets.on_disconnect(async (websocket, error) => {
				if (error && error.code !== 5000)
					await ov_Websockets.sleep(PERS_ERROR_TIMEOUT, websocket);
				authorize(websocket);
			});

			for (let websocket of ov_Websockets.list)
				authorize(websocket);
		});

		async function authorize(websocket) {
			await ov_Auth.connect(websocket);

			let session = websocket.session;
			if (session) { //auto login with session
				await ov_Auth.login(session.user, session.session, websocket);
				if (websocket.authenticated && session.role) {
					await ov_Auth.authorize_role(session.role, websocket);
					if (websocket.authorized && view_container.children.length === 0) {
						if (ov_Websockets.current_lead_websocket !== websocket && !ov_Websockets.current_lead_websocket.connected)
							ov_Websockets.switch_lead_websocket(websocket);
						if (ov_Websockets.current_lead_websocket === websocket)
							await Voice_Client.render(view_container);
					}
				}
			}
			if (view_container.children.length === 0) {
				if (ov_Websockets.current_lead_websocket !== websocket && !ov_Websockets.current_lead_websocket.connected)
					ov_Websockets.switch_lead_websocket(websocket);
				if (ov_Websockets.current_lead_websocket === websocket)
					await Auth_View.render(view_container);
			}
		}
	</script>
</body>
