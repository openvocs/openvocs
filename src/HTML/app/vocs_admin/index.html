<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>openvocs admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Place favicon.ico in the root directory -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="/css/ov_basic.css" />
</head>

<body>
    <div class="container" id="view_container">
        <button id="initial_logout_button" class="red_button">LOGOUT</button>
    </div>

    <ov-loading id="loading_screen"></ov-loading>

    <script type="text/javascript" src="/VERSION.js"></script>
    <script type="text/javascript" src="/app/vocs/views/loops/js/default_config.js"></script>
    <!-- default loop config -->
    <script type="text/javascript" src="./views/auth/js/default_config.js"></script> <!-- default login config -->
    <script type="text/javascript" src="/config_vocs.js"></script> <!-- user config -->

    <script type="module">
        import ov_Websocket from "/lib/ov_websocket.js";
        // import ov_Websocket from "/lib/test/ov_websocket_dummy.js";
        import * as ov_Websockets from "/lib/ov_websocket_list.js";
        import * as ov_Web_Storage from "/lib/ov_utils/ov_web_storage.js";
        import * as ov_Auth from "/lib/ov_auth.js";
        import * as ov_DB from "/lib/ov_db.js";

        import * as Auth_View from "./views/auth/js/auth.js";
        import * as Config_View from "./views/config/js/config.js";

        import ov_Loading from "/components/loading/loading_screen.js";

        document.addEventListener("DOMContentLoaded", async function () {
            document.getElementById("initial_logout_button").onclick = async () => {
                await ov_Auth.logout();
                ov_Websockets.reload_page();
            }

            let view_container = document.getElementById("view_container");
            let loading_screen = document.getElementById("loading_screen");
            view_container.addEventListener("switch_view", async (event) => {
                if (event.detail.origin !== event.detail.target)
                    if (event.detail.origin === Auth_View.VIEW_ID)
                        Auth_View.remove();
                    else if (event.detail.origin === Config_View.VIEW_ID)
                        Config_View.remove();

                if (event.detail.target === Config_View.VIEW_ID) {
                    loading_screen.show("Loading data from server...");
                    await Config_View.render(view_container);
                    loading_screen.hide();
                }
            });

            //initial disconnect handler gets overwritten
            ov_Websockets.on_disconnect(async (websocket, error) => {
                if (error && error.code !== 5000)
                    await ov_Websockets.sleep(PERS_ERROR_TIMEOUT, websocket);
                authenticate(websocket, loading_screen);
            });

            await ov_Websockets.setup_connections(ov_Websocket);

            for (let websocket of ov_Websockets.list)
                authenticate(websocket, loading_screen);
        });

        async function authenticate(websocket, loading_screen) {
            await ov_Auth.connect(websocket);

            let session = websocket.session;
            if (session) { //auto login with session
                await ov_Auth.login(session.user, session.session, websocket);
                if (websocket.authenticated && ov_Websockets.prime_websocket === websocket) {
                    if (session.domain) {
                        ov_Websockets.user().domain = session.domain;
                        ov_Websockets.user().project = session.project;
                        loading_screen.show("Loading data from server...")
                        console.log("switch to view", session.domain, session.project);
                        await Config_View.render(view_container, session.page);
                        loading_screen.hide();
                        return;
                    }
                }
            }
            if (ov_Websockets.prime_websocket === websocket)
                await Auth_View.render(view_container);
        }
    </script>
</body>
